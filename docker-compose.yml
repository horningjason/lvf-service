services:
  lvf:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Optional: mount a local data/ folder to override the included GeoPackage
      # or supply your own. Remove this volume entry to use only the baked-in data.
      - ./data:/app/data
    env_file:
      - .env
    environment:
      # Per-machine multi-worker. A leaf/child node may run multiple workers;
      # a good starting point is roughly the number of CPU cores, then measure.
      # NOTE: a Forest Guide node MUST run single-worker — set LVF_WORKERS=1 on
      # any service running with LVF_FOREST_GUIDE_MODE=true.
      LVF_WORKERS: "2"
      # TLS config - see docs
      # LVF_TLS_MODE:
      # LVF_TLS_CERT_FILE:
      # LVF_TLS_KEY_FILE:
      # LVF_TLS_CA_FILE:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
