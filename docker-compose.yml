services:
  lvf:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Optional: mount a local data/ folder to override the included GeoPackage
      # or supply your own. Remove this volume entry to use only the baked-in data.
      - ./data:/app/data
      # TLS: mount your node's cert directory into /app/certs (read-only).
      # Use the full path — Docker Compose does not reliably expand ~.
      # - /path/to/certs/lvf-child:/app/certs:ro
    env_file:
      - .env
    environment:
      # Per-machine multi-worker. A leaf/child node may run multiple workers;
      # a good starting point is roughly the number of CPU cores, then measure.
      # A Forest Guide (LVF_FOREST_GUIDE_MODE=true) supports multi-worker too —
      # coverage-store locking and leader election are role-agnostic — but gets
      # no CPU-parallelism benefit from it (no GIS validation to parallelize).
      LVF_WORKERS: "2"
      # TLS config - see docs
      # LVF_TLS_MODE:
      # LVF_TLS_CERT_FILE:
      # LVF_TLS_KEY_FILE:
      # LVF_TLS_CA_FILE:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
