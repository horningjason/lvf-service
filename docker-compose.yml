services:
  lvf:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Optional: mount a local data/ folder to override the included GeoPackage
      # or supply your own. Remove this volume entry to use only the baked-in data.
      - ./data:/app/data
    env_file:
      - .env
    environment:
      # TLS config - see docs
      # LVF_TLS_MODE:
      # LVF_TLS_CERT_FILE:
      # LVF_TLS_KEY_FILE:
      # LVF_TLS_CA_FILE:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
